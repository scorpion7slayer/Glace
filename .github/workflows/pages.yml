name: Publish Glace website

on:
  push:
    branches: [main]
    paths:
      - Website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glace-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out GitHub Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish website without replacing update artifacts
        run: |
          set -euo pipefail
          rsync -a --delete --exclude updates --exclude .git Website/ gh-pages/
          mkdir -p gh-pages/updates
          rsync -a Website/updates/ gh-pages/updates/
          touch gh-pages/.nojekyll
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish Glace website" || echo "No website changes to commit"
          git push origin HEAD:gh-pages
