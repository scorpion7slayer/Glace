name: Release Glace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: glace-gh-pages
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      APP_NAME: Glace
      PROJECT_PATH: Ice.xcodeproj
      SCHEME: Ice
      PAGES_BASE_URL: https://scorpion7slayer.github.io/Glace/updates
    steps:
      - name: Resolve release tag
        id: release_tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH (received: $RELEASE_TAG)" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release_tag.outputs.value }}

      - name: Select compatible Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: latest-stable

      - name: Initialize release metadata
        run: |
          set -euo pipefail
          MARKETING_VERSION="${RELEASE_TAG#v}"
          PROJECT_VERSION="$(xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration Release -showBuildSettings | awk -F ' = ' '/ MARKETING_VERSION = / { print $2; exit }')"
          PROJECT_BUILD="$(xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration Release -showBuildSettings | awk -F ' = ' '/ CURRENT_PROJECT_VERSION = / { print $2; exit }')"
          if [ "$PROJECT_VERSION" != "$MARKETING_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match project version $PROJECT_VERSION" >&2
            exit 1
          fi
          if ! [[ "$PROJECT_BUILD" =~ ^[0-9]+$ ]]; then
            echo "Project build number must be numeric (received: $PROJECT_BUILD)" >&2
            exit 1
          fi
          {
            echo "MARKETING_VERSION=$MARKETING_VERSION"
            echo "CURRENT_PROJECT_VERSION=$PROJECT_BUILD"
            echo "DERIVED_DATA_PATH=$RUNNER_TEMP/GlaceDerivedData"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/Glace.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/GlaceExport"
            echo "PAGES_PATH=$GITHUB_WORKSPACE/gh-pages"
            echo "PAGES_UPDATES_PATH=$GITHUB_WORKSPACE/gh-pages/updates"
          } >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Validate release secrets
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          required=(
            APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID
            MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD
            MACOS_KEYCHAIN_PASSWORD SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive universal Glace app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Export signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$EXPORT_OPTIONS_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :method string developer-id' "$EXPORT_OPTIONS_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$EXPORT_OPTIONS_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS_PLIST"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

      - name: Validate app bundle and signatures
        id: bundle
        run: |
          set -euo pipefail
          APP_PATH="$EXPORT_PATH/$APP_NAME.app"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")"
          if [ "$APP_VERSION" != "$MARKETING_VERSION" ] || [ "$APP_BUILD" != "$CURRENT_PROJECT_VERSION" ]; then
            echo "Exported app version mismatch: $APP_VERSION ($APP_BUILD)" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dvvv --entitlements :- "$APP_PATH"
          file "$APP_PATH/Contents/MacOS/$APP_NAME"
          ARCHITECTURES="$(lipo -archs "$APP_PATH/Contents/MacOS/$APP_NAME")"
          if [[ " $ARCHITECTURES " != *" arm64 "* ]] || [[ " $ARCHITECTURES " != *" x86_64 "* ]]; then
            echo "Exported app is not universal (architectures: $ARCHITECTURES)" >&2
            exit 1
          fi
          DMG_NAME="${APP_NAME}-${APP_VERSION}.dmg"
          {
            echo "APP_PATH=$APP_PATH"
            echo "APP_VERSION=$APP_VERSION"
            echo "APP_BUILD=$APP_BUILD"
            echo "DMG_NAME=$DMG_NAME"
            echo "DMG_PATH=$RUNNER_TEMP/$DMG_NAME"
          } >> "$GITHUB_ENV"
          echo "dmg_path=$RUNNER_TEMP/$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create signed DMG
        run: |
          set -euo pipefail
          chmod +x scripts/create_dmg.sh
          scripts/create_dmg.sh "$APP_PATH" "$DMG_PATH"
          codesign --force --sign 'Developer ID Application' --timestamp "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

      - name: Notarize and staple DMG
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl -a -t open --context context:primary-signature -v "$DMG_PATH"

      - name: Attest release artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.bundle.outputs.dmg_path }}

      - name: Check out GitHub Pages branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare website and update feed
        run: |
          set -euo pipefail
          mkdir -p "$PAGES_UPDATES_PATH"
          rsync -a --exclude updates Website/ "$PAGES_PATH/"
          cp "$DMG_PATH" "$PAGES_UPDATES_PATH/$DMG_NAME"

      - name: Render release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          RELEASE_NOTES_SOURCE="$RUNNER_TEMP/release-notes.md"
          RELEASE_NOTES_OUTPUT="$PAGES_UPDATES_PATH/${DMG_NAME%.dmg}.html"
          if [ -n "${RELEASE_BODY:-}" ]; then
            printf '%s\n' "$RELEASE_BODY" > "$RELEASE_NOTES_SOURCE"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .body > "$RELEASE_NOTES_SOURCE"
          fi
          chmod +x scripts/render_release_notes.py
          scripts/render_release_notes.py "$RELEASE_NOTES_SOURCE" "$RELEASE_NOTES_OUTPUT" "$APP_VERSION"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SPARKLE_BIN_DIR="$DERIVED_DATA_PATH/SourcePackages/artifacts/sparkle/Sparkle/bin"
          if [ ! -x "$SPARKLE_BIN_DIR/generate_appcast" ]; then
            echo "Sparkle generate_appcast tool not found at $SPARKLE_BIN_DIR" >&2
            exit 1
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$SPARKLE_BIN_DIR/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "$PAGES_BASE_URL/" \
              --release-notes-url-prefix "$PAGES_BASE_URL/" \
              "$PAGES_UPDATES_PATH"

      - name: Publish website and appcast
        run: |
          set -euo pipefail
          cd "$PAGES_PATH"
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish Glace ${APP_VERSION} (${APP_BUILD})" || echo "No Pages changes to commit"
          git push origin HEAD:gh-pages

      - name: Upload DMG to GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ steps.bundle.outputs.dmg_path }}
          tag_name: ${{ steps.release_tag.outputs.value }}
